<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학급 운영 통합 대시보드</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js">
/* ══ 즐겨찾기 ══ */
var DEFAULT_BOOKMARKS=[
  {name:'나이스',url:'https://neis.go.kr'},
  {name:'에듀넷',url:'https://edunet.net'},
  {name:'학교알리미',url:'https://www.schoolinfo.go.kr'},
  {name:'공공데이터포털',url:'https://data.go.kr'},
];
var bookmarkList=DEFAULT_BOOKMARKS.slice();

function getFavicon(url){
  try{var u=new URL(url);return'https://www.google.com/s2/favicons?domain='+u.hostname+'&sz=16';}
  catch(e){return'';}
}

function renderBookmarks(){
  var el=document.getElementById('bookmark-list');
  if(!el)return;
  if(!bookmarkList.length){
    el.innerHTML='<div style="color:#ccc;font-size:12px;text-align:center;padding:12px;">✏️ 편집을 눌러 추가하세요</div>';
    return;
  }
  el.innerHTML=bookmarkList.map(function(b){
    return '<a class="bookmark-item" href="'+b.url+'" target="_blank" rel="noopener">'+
      '<img class="bookmark-favicon" src="'+getFavicon(b.url)+'" onerror="this.style.display=\'none\'">'+
      '<span class="bookmark-name">'+b.name+'</span>'+
      '<span class="bookmark-arrow">↗</span>'+
    '</a>';
  }).join('');
}

function toggleBookmarkEdit(){
  var el=document.getElementById('bookmark-edit');
  var showing=el.style.display!=='none';
  el.style.display=showing?'none':'block';
  if(!showing){
    document.getElementById('bookmark-textarea').value=
      bookmarkList.map(function(b){return b.name+','+b.url;}).join('\n');
  }
}

function saveBookmarks(){
  var lines=document.getElementById('bookmark-textarea').value.split('\n');
  bookmarkList=lines.map(function(line){
    var parts=line.split(',');
    var name=parts[0]?parts[0].trim():'';
    var url=parts.slice(1).join(',').trim();
    if(!url.startsWith('http')) url='https://'+url;
    return{name:name,url:url};
  }).filter(function(b){return b.name&&b.url;});
  document.getElementById('bookmark-edit').style.display="none";
  renderBookmarks();
  saveToCloud({bookmarks:bookmarkList});
}

renderBookmarks();
</script>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans KR',sans-serif;background:linear-gradient(135deg,#e8f8ec 0%,#f0fdf4 50%,#e0f2fe 100%);height:100vh;overflow:hidden;}

/* 로그인 모달 */

/* 그리드 */
#dashboard{display:grid;grid-template-columns:3fr 3.5fr 3.5fr;gap:10px;padding:10px;height:100vh;box-sizing:border-box;}
#col-left{display:grid;grid-template-rows:1fr 300px 1fr;gap:10px;min-height:0;}
#col-mid{display:grid;grid-template-rows:auto 1fr 2fr;gap:10px;min-height:0;}
#col-right{display:grid;grid-template-rows:auto auto 1fr;gap:10px;min-height:0;}

/* 카드 */
.card{background:rgba(255,255,255,0.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(178,242,187,0.5);border-radius:20px;box-shadow:0 8px 32px rgba(34,139,34,0.10),0 2px 8px rgba(0,0,0,0.05);display:flex;flex-direction:column;overflow:hidden;min-height:0;}
.card-header{display:flex;align-items:center;justify-content:space-between;padding:9px 14px 8px;background:linear-gradient(135deg,rgba(178,242,187,0.38),rgba(144,238,160,0.18));border-bottom:1px solid rgba(178,242,187,0.38);flex-shrink:0;}
.card-title{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:700;color:#1a5c2a;}
.card-icon{width:24px;height:24px;background:linear-gradient(135deg,#b2f2bb,#6ee7a0);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
.card-body{flex:1;overflow:auto;padding:10px 14px;min-height:0;}
.card-body::-webkit-scrollbar{width:3px;}
.card-body::-webkit-scrollbar-thumb{background:rgba(178,242,187,0.6);border-radius:2px;}
.small-btn{background:none;border:none;cursor:pointer;font-size:11px;color:#aaa;font-family:'Noto Sans KR',sans-serif;padding:2px 6px;border-radius:5px;}
.small-btn:hover{background:rgba(178,242,187,0.3);color:#4a7a4a;}

/* 로그인/아웃 + 테마 가로 배치 */
.top-row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;min-height:0;}

/* 사용자 카드 */
.user-card-inner{display:flex;align-items:center;justify-content:center;padding:8px 10px;height:100%;}
.user-avatar{width:22px;height:22px;border-radius:50%;object-fit:cover;flex-shrink:0;}
/* 로그인/로그아웃 공통 버튼 스타일 */
.login-card-btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:8px 10px;background:linear-gradient(135deg,rgba(178,242,187,0.4),rgba(144,238,160,0.25));border:1.5px solid rgba(178,242,187,0.7);border-radius:12px;font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:700;color:#1a5c2a;cursor:pointer;transition:all .2s;}
.login-card-btn:hover{background:linear-gradient(135deg,#b2f2bb,#6ee7a0);box-shadow:0 3px 10px rgba(100,200,100,0.25);}
.login-card-btn img{width:18px;height:18px;flex-shrink:0;}
.logout-card-btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:8px 10px;background:rgba(255,200,200,0.3);border:1.5px solid rgba(255,150,150,0.5);border-radius:12px;font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:700;color:#c62828;cursor:pointer;transition:all .2s;}
.logout-card-btn:hover{background:rgba(255,150,150,0.4);}
.save-badge{font-size:10px;color:#6ee7a0;font-weight:600;display:none;position:absolute;top:4px;right:6px;}

/* 테마 선택 카드 */
.color-picker-wrap{display:flex;align-items:center;justify-content:center;height:100%;padding:4px;position:relative;}.color-current{width:28px;height:28px;border-radius:50%;cursor:pointer;border:3px solid rgba(255,255,255,0.8);box-shadow:0 2px 8px rgba(0,0,0,0.15);transition:transform .2s;flex-shrink:0;}.color-current:hover{transform:scale(1.1);}.color-palette{gap:7px;}.color-dot{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .15s;flex-shrink:0;}.color-dot:hover{transform:scale(1.2);}.color-dot.active{border-color:#fff;box-shadow:0 0 0 2px rgba(0,0,0,0.2);}.color-dot{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .15s;flex-shrink:0;}.color-dot:hover{transform:scale(1.2);}.color-dot.active{border-color:#fff;box-shadow:0 0 0 2px rgba(0,0,0,0.2);}
.color-dot{width:24px;height:24px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:all .2s;flex-shrink:0;}
.color-dot:hover{transform:scale(1.2);}
.color-dot.active{border-color:#fff;box-shadow:0 0 0 2px rgba(0,0,0,0.25);}

/* 달력 */
.mcal{width:100%;height:100%;display:flex;flex-direction:column;gap:3px;}
.mcal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
.mcal-title{font-size:17px;font-weight:700;color:#1a5c2a;}
.mcal-nav{background:none;border:none;cursor:pointer;color:#4a7a4a;font-size:18px;padding:0 4px;line-height:1;}
.mcal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:2px;}
.mcal-day-label{font-size:12px;font-weight:700;color:#7aaa7a;text-align:center;padding:2px 0;}
.mcal-day-label.sun{color:#e57373;}.mcal-day-label.sat{color:#64b5f6;}
.mcal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;flex:1;}
.mcal-cell{display:flex;align-items:center;justify-content:center;border-radius:6px;font-size:14px;font-weight:500;color:#2d4a2d;min-height:0;}
.mcal-cell.today{background:linear-gradient(135deg,#b2f2bb,#6ee7a0);font-weight:700;color:#1a5c2a;border-radius:50%;}
.mcal-cell.other-month{color:#ccc;}
.mcal-cell.sun{color:#e57373;}.mcal-cell.sat{color:#64b5f6;}
.mcal-cell.today.sun,.mcal-cell.today.sat{color:#1a5c2a;}

/* 메모 */
.memo-line{border-bottom:1px solid rgba(178,242,187,0.45);height:30px;}
.memo-area{position:relative;z-index:1;width:100%;height:100%;background:transparent;border:none;outline:none;resize:none;font-family:'Noto Sans KR',sans-serif;font-size:15px;line-height:30px;color:#2d4a2d;padding:0;caret-color:#1a5c2a;}
.memo-area::placeholder{color:#c0ddc0;}

/* D-Day */
.dday-list{display:flex;flex-direction:column;gap:5px;overflow-y:auto;flex:1;}
.dday-item{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;background:rgba(178,242,187,0.15);border-radius:10px;border:1px solid rgba(178,242,187,0.3);flex-shrink:0;}
.dday-label{font-size:16px;font-weight:700;color:#2d4a2d;flex:1;}
.dday-date-txt{font-size:12px;color:#7aaa7a;font-weight:500;white-space:nowrap;margin-right:8px;}
.dday-count{font-size:20px;font-weight:700;color:#1a5c2a;white-space:nowrap;}
.dday-today{color:#e57373;}.dday-past{color:#aaa;font-size:13px;}
.dday-del{background:none;border:none;cursor:pointer;color:#ccc;font-size:12px;margin-left:6px;}
.dday-del:hover{color:#e57373;}
.dday-add-row{display:flex;gap:5px;flex-wrap:wrap;flex-shrink:0;margin-top:7px;}
.dday-input{flex:1;min-width:80px;border:1px solid rgba(178,242,187,0.6);border-radius:7px;padding:5px 7px;font-family:'Noto Sans KR',sans-serif;font-size:12px;color:#2d4a2d;background:rgba(255,255,255,0.85);outline:none;}
.dday-input:focus{border-color:#6ee7a0;}
.dday-add-btn{padding:5px 10px;background:linear-gradient(135deg,#b2f2bb,#6ee7a0);border:none;border-radius:7px;color:#1a5c2a;font-size:12px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;}
.dday-empty{text-align:center;color:#ccc;font-size:12px;padding:8px;}

/* 날씨 */
.weather-main{display:flex;align-items:center;justify-content:center;gap:10px;padding:4px 0;}
.weather-icon{font-size:38px;}
.weather-temp{font-size:36px;font-weight:700;color:#1a5c2a;}
.weather-info{display:flex;flex-direction:column;gap:2px;}
.weather-desc{font-size:16px;color:#4a7a4a;font-weight:600;}
.weather-sub{font-size:13px;color:#7aaa7a;}
.weather-detail{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px;padding-top:8px;border-top:0.5px solid rgba(178,242,187,0.4);}
.w-item{text-align:center;background:rgba(178,242,187,0.1);border-radius:10px;padding:8px 4px;}
.wlabel{font-size:13px;color:#888;font-weight:500;margin-bottom:3px;}
.wval{font-size:18px;font-weight:700;color:#2d4a2d;}
.pm-good{color:#2e7d32;}.pm-normal{color:#1565c0;}.pm-bad{color:#e65100;}.pm-very-bad{color:#b71c1c;}
.weather-loading{text-align:center;color:#aaa;font-size:12px;padding:8px;}

/* 타이머 */
.timer-time{font-family:'Orbitron',monospace;font-size:clamp(26px,3vw,44px);font-weight:700;color:#1a5c2a;letter-spacing:2px;text-align:center;font-variant-numeric:tabular-nums;font-feature-settings:"tnum";}
.timer-label{font-size:12px;color:#7aaa7a;text-align:center;margin-top:2px;}
.timer-progress{width:100%;height:7px;background:rgba(178,242,187,0.2);border-radius:4px;margin:7px 0;overflow:hidden;}
.timer-bar{height:100%;background:linear-gradient(90deg,#b2f2bb,#6ee7a0);border-radius:4px;transition:width .5s linear,background .5s;}
.timer-presets{display:flex;gap:5px;margin-bottom:7px;}
.timer-preset{flex:1;padding:5px 2px;background:rgba(178,242,187,0.2);border:1px solid rgba(178,242,187,0.5);border-radius:8px;color:#2d6a2d;font-size:12px;font-weight:600;cursor:pointer;font-family:'Noto Sans KR',sans-serif;text-align:center;}
.timer-preset:hover{background:rgba(178,242,187,0.5);}
.timer-btns{display:flex;gap:6px;}
.timer-btn{flex:1;padding:7px;border:none;border-radius:10px;font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:700;cursor:pointer;}
.t-start{background:linear-gradient(135deg,#b2f2bb,#6ee7a0);color:#1a5c2a;}
.t-pause{background:rgba(255,235,180,0.7);color:#7a5a00;}
.t-reset{background:rgba(220,220,220,0.6);color:#555;}

/* 발표자 */
.picker-name{font-size:clamp(22px,2.5vw,36px);font-weight:700;color:#1a5c2a;min-height:42px;display:flex;align-items:center;justify-content:center;text-align:center;}
.picker-name.rolling{animation:roll .08s infinite alternate;color:#6ee7a0;}
@keyframes roll{from{transform:translateY(-1px);}to{transform:translateY(1px);}}
.picker-btn{width:100%;padding:7px;background:linear-gradient(135deg,#b2f2bb,#6ee7a0);border:none;border-radius:10px;color:#1a5c2a;font-size:13px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;margin-top:4px;}
.picker-count{font-size:11px;color:#aaa;text-align:center;margin-top:3px;}
.picker-textarea{width:100%;border:1px solid rgba(178,242,187,0.6);border-radius:8px;padding:6px;font-family:'Noto Sans KR',sans-serif;font-size:12px;color:#2d4a2d;background:rgba(255,255,255,0.85);resize:none;outline:none;height:70px;line-height:1.6;margin-top:4px;}
.picker-textarea:focus{border-color:#6ee7a0;}
.picker-save-btn{width:100%;margin-top:4px;padding:5px;background:linear-gradient(135deg,#b2f2bb,#6ee7a0);border:none;border-radius:7px;color:#1a5c2a;font-size:12px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;}

/* 시간표 */
.timetable{width:100%;border-collapse:collapse;table-layout:fixed;}
.timetable th{background:linear-gradient(135deg,#b2f2bb,#6ee7a0);color:#1a5c2a;padding:8px 4px;text-align:center;font-weight:700;font-size:17px;}
.timetable th:first-child{border-radius:8px 0 0 0;}.timetable th:last-child{border-radius:0 8px 0 0;}
.timetable td{padding:7px 3px;text-align:center;border-bottom:0.5px solid rgba(178,242,187,0.35);color:#2d4a2d;font-size:16px;}
.timetable tr:last-child td{border-bottom:none;}
.timetable tr:nth-child(even) td{background:rgba(178,242,187,0.09);}
.pnum{font-weight:700;color:#1a5c2a;font-size:17px;}
.stag{display:inline-block;padding:2px 8px;border-radius:5px;font-size:15px;font-weight:600;}
.s-국어{background:#e8f5e9;color:#2e7d32;}.s-수학{background:#e3f2fd;color:#1565c0;}.s-영어{background:#fff8e1;color:#e65100;}.s-과학{background:#f3e5f5;color:#6a1b9a;}.s-사회{background:#fce4ec;color:#880e4f;}.s-도덕{background:#e0f7fa;color:#006064;}.s-체육{background:#f1f8e9;color:#1b5e20;}.s-음악{background:#fce4ec;color:#ad1457;}.s-미술{background:#fff3e0;color:#bf360c;}.s-실과{background:#f1f8e9;color:#33691e;}.s-창체{background:#ede7f6;color:#4527a0;}.s-안전{background:#fff3e0;color:#bf360c;}.s-default{background:#f5f5f5;color:#555;}
.edit-table{width:100%;border-collapse:collapse;}
.edit-table th{background:linear-gradient(135deg,#b2f2bb,#6ee7a0);color:#1a5c2a;padding:6px 3px;text-align:center;font-weight:700;font-size:12px;}
.edit-table th:first-child{border-radius:8px 0 0 0;}.edit-table th:last-child{border-radius:0 8px 0 0;}
.edit-table td{padding:2px;border-bottom:0.5px solid rgba(178,242,187,0.3);}
.edit-table tr:last-child td{border-bottom:none;}
.edit-table tr:nth-child(even) td{background:rgba(178,242,187,0.06);}
.pnum-cell{font-weight:700;color:#1a5c2a;font-size:12px;background:rgba(178,242,187,0.18);padding:5px 3px;}
.edit-input{width:100%;border:1px solid rgba(178,242,187,0.6);border-radius:5px;padding:3px 4px;font-family:'Noto Sans KR',sans-serif;font-size:12px;color:#2d4a2d;background:rgba(255,255,255,0.9);text-align:center;outline:none;}

<script>
/* ══ Firebase ══ */
firebase.initializeApp({
  apiKey:"AIzaSyBbjoPZCCV3RHG0ZjX-n7hpdUhbQhAxvfM",
  authDomain:"myodo-dashboard.firebaseapp.com",
  projectId:"myodo-dashboard",
  storageBucket:"myodo-dashboard.firebasestorage.app",
  messagingSenderId:"725219047883",
  appId:"1:725219047883:web:1112e20622b64e9a7b9e4e"
});
var auth=firebase.auth(), db=firebase.firestore();
var currentUser=null, saveTimer=null;

/* ══ 로그인 ══ */
function googleLogin(){
  auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())
    .catch(function(e){ console.error('로그인 오류:',e.message); });
}
function logout(){ auth.signOut(); }

/* ══ 인증 상태 ══ */
auth.onAuthStateChanged(function(user){
  currentUser=user;
  var loginState=document.getElementById('login-state');
  var logoutState=document.getElementById('logout-state');
  if(user){
    loginState.style.display="none";
    logoutState.style.display='flex';
    document.getElementById('user-avatar').src=user.photoURL||'';
    document.getElementById('user-name').textContent=user.displayName||user.email;
    loadFromCloud(applyCloudData);
  } else {
    loginState.style.display='block';
    logoutState.style.display="none";
  }
});

/* ══ Firestore ══ */
function userDoc(){ return db.collection('users').doc(currentUser.uid); }
function saveToCloud(data){
  if(!currentUser) return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){
    userDoc().set(data,{merge:true}).then(function(){
      var b=document.getElementById('save-badge');
      b.style.display='block';
      setTimeout(function(){b.style.display="none";},2000);
    }).catch(function(e){console.error('[저장실패]',e);});
  },1000);
}
function loadFromCloud(cb){
  if(!currentUser){cb({});return;}
  userDoc().get().then(function(doc){
    console.log('[Firebase] 불러옴:', doc.exists);
    cb(doc.exists?doc.data():{});
  }).catch(function(e){console.error('[불러오기실패]',e);cb({});});
}
function applyCloudData(data){
  /* 메모 */
  var memo=data.memo||'';
  document.getElementById('memo-area').value=memo;
  document.getElementById('memo-counter').textContent=memo.length+'자';
  /* D-Day */
  ddayList=data.ddays||[{name:'여름방학식',date:'2026-07-22'}];
  renderDdays();
  /* 발표자 */
  studentList=data.students||['학생1','학생2','학생3'];
  updatePickerCount();
  /* 시간표 */
  ttData=data.timetable||JSON.parse(JSON.stringify(DEFAULT_TT));
  document.getElementById('tt-body').innerHTML=renderView(ttData);
  /* 스티커 */
  stickerStudents=data.stickerStudents||['학생1','학생2','학생3'];
  stickerData=data.stickerData||{};
  renderSticker();
  /* 테마 */
  if(data.theme) setTheme(data.theme);
  /* 즐겨찾기 */
  bookmarkList=data.bookmarks||DEFAULT_BOOKMARKS;
  renderBookmarks();
}

/* ══ 시계 ══ */
var DAYS_KR=['일요일','월요일','화요일','수요일','목요일','금요일','토요일'];
var MONTHS_KR=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
function updateClock(){
  var n=new Date(),h24=n.getHours(),h12=h24%12||12;
  document.getElementById('clock-ampm').textContent=h24<12?'오전':'오후';
  document.getElementById('clock-h').textContent=String(h12).padStart(2,'0');
  document.getElementById('clock-m').textContent=String(n.getMinutes()).padStart(2,'0');
  document.getElementById('clock-s').textContent=String(n.getSeconds()).padStart(2,'0');
  document.getElementById('clock-date').textContent=n.getFullYear()+'년 '+MONTHS_KR[n.getMonth()]+' '+n.getDate()+'일';
  document.getElementById('clock-day').textContent=DAYS_KR[n.getDay()];
}
setInterval(updateClock,1000); updateClock();

/* ══ 급식 ══ */
function loadMeal(){
  var t=new Date();
  document.getElementById('meal-date').textContent=t.getFullYear()+'년 '+(t.getMonth()+1)+'월 '+t.getDate()+'일';
  var ymd=t.getFullYear()+String(t.getMonth()+1).padStart(2,'0')+String(t.getDate()).padStart(2,'0');

function getBaseTime(){var now=new Date(),kst=new Date(now.getTime()+(9*60*60*1000));if(kst.getUTCMinutes()<10)kst.setUTCHours(kst.getUTCHours()-1);return{date:kst.getUTCFullYear()+String(kst.getUTCMonth()+1).padStart(2,'0')+String(kst.getUTCDate()).padStart(2,'0'),time:String(kst.getUTCHours()).padStart(2,'00')+'00'};}
function ptyIcon(pty){if(pty==='1')return{icon:'🌧️',desc:'비'};if(pty==='2')return{icon:'🌨️',desc:'비/눈'};if(pty==='3')return{icon:'❄️',desc:'눈'};if(pty==='4')return{icon:'🌦️',desc:'소나기'};var h=new Date(new Date().getTime()+(9*60*60*1000)).getUTCHours();return h>=6&&h<18?{icon:'☀️',desc:'맑음'}:{icon:'🌙',desc:'맑음'};}
function pmGrade(val){if(!val||val==='-')return{txt:'정보없음',cls:''};var v=parseInt(val);if(v<=30)return{txt:'좋음 ('+v+'㎍)',cls:'pm-good'};if(v<=80)return{txt:'보통 ('+v+'㎍)',cls:'pm-normal'};if(v<=150)return{txt:'나쁨 ('+v+'㎍)',cls:'pm-bad'};return{txt:'매우나쁨 ('+v+'㎍)',cls:'pm-very-bad'};}
function loadWeather(){

    .then(function(r){return r.json();}).then(function(data){

      loadAirQuality();

var SHEET_CSV='https://docs.google.com/spreadsheets/d/e/2PACX-1vQPZ0Fk4ryF895ZoC7J1tV6fOTSXw8ng_j2MxkHx90EtQME-m3C6Z3Oluri4iCzheTzOKrmuFLr0Ls3/pub?gid=1848563708&single=true&output=csv';
function parseCSV(text){var rows=[],row=[],cell='',inQ=false;for(var i=0;i<text.length;i++){var ch=text[i];if(inQ){if(ch==='"'&&text[i+1]==='"'){cell+='"';i++;}else if(ch==='"'){inQ=false;}else{cell+=ch;}}else{if(ch==='"'){inQ=true;}else if(ch===','){row.push(cell.trim());cell='';}else if(ch==='\n'){row.push(cell.trim());rows.push(row);row=[];cell='';}else if(ch!=='\r'){cell+=ch;}}}if(cell||row.length){row.push(cell.trim());rows.push(row);}return rows;}
function subjectBg(text){if(!text||!text.trim())return'';var t=text.trim();var map={'국어':'#e8f5e9','수학':'#e3f2fd','영어':'#fff8e1','과학':'#f3e5f5','사회':'#fce4ec','도덕':'#e0f7fa','체육':'#f1f8e9','음악':'#fce4ec','미술':'#fff3e0','실과':'#f1f8e9','창체':'#ede7f6','안전':'#fff3e0'};for(var k in map){if(t.indexOf(k)>=0)return map[k];}return'rgba(178,242,187,0.15)';}
function loadTodaySchedule(){
  var body=document.getElementById('today-sch');if(body)body.innerHTML='<div class="meal-loading">불러오는 중...</div>';
  fetch(CF_PROXY+'/sheets?url='+encodeURIComponent(SHEET_CSV)).then(function(r){return r.text();}).then(function(text){
    var rows=parseCSV(text),dateRow=rows[2]||[],today=new Date(),todayDay=today.getDate(),todayMonth=today.getMonth()+1,colIdx=-1;
    for(var c=1;c<dateRow.length;c++){var cell=dateRow[c].trim();var m=cell.match(/(\d+)\s*월\s*(\d+)\s*일/);if(m&&parseInt(m[1])===todayMonth&&parseInt(m[2])===todayDay){colIdx=c;break;}var m2=cell.match(/^(\d+)\/(\d+)$/);if(m2&&parseInt(m2[1])===todayMonth&&parseInt(m2[2])===todayDay){colIdx=c;break;}}
    if(colIdx<0){if(body)body.innerHTML='<div style="color:#e57373;font-size:12px;text-align:center;padding:10px;">오늘 날짜를 찾을 수 없습니다</div>';return;}
    var html='';for(var r=4;r<=9;r++){var rowData=rows[r]||[],content=(rowData[colIdx]||'').trim(),lines=content.split('\n').map(function(s){return s.trim();}).filter(Boolean);html+='<div class="today-period"><span class="today-pnum">'+(r-3)+'교시</span><span class="today-content" style="background:'+subjectBg(content)+'">'+(lines.length?lines.join('<br>'):'<span style="color:#ddd;">—</span>')+'</span></div>';}
    if(body)body.innerHTML=html||'<div class="meal-loading">데이터 없음</div>';
  }).catch(function(e){console.warn('[시간표]',e);if(body)body.innerHTML='<div style="color:#e57373;font-size:12px;text-align:center;padding:10px;">불러올 수 없습니다</div>';});
}
loadTodaySchedule();setInterval(loadTodaySchedule,3600000);

var DEFAULT_BOOKMARKS=[
  {name:'나이스',url:'https://neis.go.kr'},
  {name:'에듀넷',url:'https://edunet.net'},
  {name:'학교알리미',url:'https://www.schoolinfo.go.kr'},
  {name:'공공데이터포털',url:'https://data.go.kr'},
];
var bookmarkList=DEFAULT_BOOKMARKS.slice();

function getFavicon(url){
  try{var u=new URL(url);return'https://www.google.com/s2/favicons?domain='+u.hostname+'&sz=16';}
  catch(e){return'';}
}

function renderBookmarks(){
  var el=document.getElementById('bookmark-list');
  if(!el)return;
  if(!bookmarkList.length){
    el.innerHTML='<div style="color:#ccc;font-size:12px;text-align:center;padding:12px;">✏️ 편집을 눌러 추가하세요</div>';
    return;
  }
  el.innerHTML=bookmarkList.map(function(b){
    return '<a class="bookmark-item" href="'+b.url+'" target="_blank" rel="noopener">'+
      '<img class="bookmark-favicon" src="'+getFavicon(b.url)+'" onerror="this.style.display=\'none\'">'+
      '<span class="bookmark-name">'+b.name+'</span>'+
      '<span class="bookmark-arrow">↗</span>'+
    '</a>';
  }).join('');
}

function toggleBookmarkEdit(){
  var el=document.getElementById('bookmark-edit');
  var showing=el.style.display!=='none';
  el.style.display=showing?'none':'block';
  if(!showing){
    document.getElementById('bookmark-textarea').value=
      bookmarkList.map(function(b){return b.name+','+b.url;}).join('\n');
  }
}

function saveBookmarks(){
  var lines=document.getElementById('bookmark-textarea').value.split('\n');
  bookmarkList=lines.map(function(line){
    var parts=line.split(',');
    var name=parts[0]?parts[0].trim():'';
    var url=parts.slice(1).join(',').trim();
    if(!url.startsWith('http')) url='https://'+url;
    return{name:name,url:url};
  }).filter(function(b){return b.name&&b.url;});
  document.getElementById('bookmark-edit').style.display="none";
  renderBookmarks();
  saveToCloud({bookmarks:bookmarkList});
}
